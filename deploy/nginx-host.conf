# quality-Iqc — aa.xxx.com
# 本文件为脱敏模板；部署前把 aa.xxx.com 替换为真实域名。
# 复用现有 Nginx 的 80 端口，仅新增一个 server_name 虚拟主机。
# 将本文件放到 /etc/nginx/sites-available/qualityiqc.conf 并启用。
# DNS 生效后执行：
#   sudo certbot --nginx -d aa.xxx.com --redirect
#
# 上游是 Docker Web 容器，映射到宿主机回环地址 127.0.0.1:8088。

server {
    listen 80;
    listen [::]:80;
    server_name aa.xxx.com;

    client_max_body_size 30m;

    access_log /var/log/nginx/qualityiqc.access.log;
    error_log  /var/log/nginx/qualityiqc.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }
}
